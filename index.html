<!DOCTYPE html>
<html>

<head>
    <title>Workshop #HTML-FORM</title>
    <meta charset="UTF-8" />

    <!-- <link rel="stylesheet" href="mystyle.css">   -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


</head>

<body>
    <div class="container py-5">

        <form>
            <div class="mb-3 row">
                <label for="fname" class="col-sm-2 col-form-label">ชื่อ <span class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <input type="text" id="fname" name="fname" class="form-control">
                </div>
            </div>


            <div class="mb-3 row">
                <label for="lname" class="col-sm-2 col-form-label">สกุล</label>
                <div class="col-sm-10">
                    <input type="text" id="lname" name="lname" class="form-control">
                </div>
            </div>

            <div class="mb-3 row">
                <label for="birthdate" class="col-sm-2 col-form-label">วัน/เดือน/ปีเกิด</label>
                <div class="col-sm-10">
                    <input type="date" id="birthdate" name="birthdate" class="form-control">
                </div>
            </div>

            <div class="mb-3 row">
                <label for="age" class="col-sm-2 col-form-label">อายุ</label>
                <div class="col-sm-10">
                    <input type="text" id="age" name="age" class="form-control">
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">เพศ</label>
                <div class="col-sm-10">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="male" name="gender" value="male">
                        <label class="form-check-label" for="male">ชาย</label>
                    </div> <br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="female" name="gender" value="female">
                        <label class="form-check-label" for="female">หญิง</label>
                    </div>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="picture" class="col-sm-2 col-form-label">รูป</label>
                <div class="col-sm-10">
                    <input type="file" id="picture" name="picture" class="form-control">
                </div>
            </div>

            <div class="mb-3 row">
                <label for="address" class="col-sm-2 col-form-label">ที่อยู่</label>
                <div class="col-sm-10">
                    <textarea id="address" name="address" rows="4" class="form-control"></textarea>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="color" class="col-sm-2 col-form-label">สีที่ชอบ</label>
                <div class="col-sm-10">
                    <select id="color" name="color" class="form-select">
                        <option>สีแดง</option>
                        <option>สีน้ำเงิน</option>
                        <option>สีเขียว</option>
                        <option>สีเหลือง</option>
                    </select>
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">แนวเพลงที่ชอบ</label>
                <div class="col-sm-10">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="life" name="music" value="life">
                        <label class="form-check-label" for="life">เพื่อชีวิต</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="lukthung" name="music" value="lukthung">
                        <label class="form-check-label" for="lukthung">ลูกทุ่ง</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="other" name="music" value="other">
                        <label class="form-check-label" for="other">อื่นๆ</label>
                    </div>
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" id="consent" name="consent" class="form-check-input">
                <label for="consent" class="form-check-label">ยินยอมให้เก็บข้อมูล</label>
            </div>


            <div class="d-flex justify-content-between align-items-center">
                <button type="reset" class="btn btn-secondary">Reset</button>
                <button type="submit" class="btn btn-success">Submit</button>
            </div>


        </form>
    </div>
</body>

</html>
